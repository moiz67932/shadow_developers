services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nascon}
      POSTGRES_USER: ${POSTGRES_USER:-nascon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nascon}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    build:
      context: .
      dockerfile: infrastructure/minio.Dockerfile
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nasconminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9000/minio/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 30
    restart: unless-stopped
  mediamtx:
    build:
      context: .
      dockerfile: infrastructure/mediamtx.Dockerfile
    ports: ["1935:1935", "8888:8888", "8889:8889", "8189:8189/udp"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9997/v3/paths/list').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 30
    restart: unless-stopped
  selenium-hub:
    image: selenium/hub:4.25.0
    ports: ["4444:4444", "4442:4442", "4443:4443"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4444/status | python3 -c 'import sys,json; s=json.load(sys.stdin)[\"value\"]; sys.exit(0 if s[\"ready\"] and len(s[\"nodes\"])>=3 else 1)'"]
      interval: 5s
      timeout: 3s
      retries: 24
  node-chrome-1:
    image: selenium/node-chrome:4.25.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    environment: &browser_env
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 2
      SE_START_VNC: "false"
      SE_START_NO_VNC: "false"
    healthcheck: &browser_health
      test: ["CMD-SHELL", "curl -fsS http://localhost:5555/status | python3 -c 'import sys,json; sys.exit(0 if json.load(sys.stdin)[\"value\"][\"ready\"] else 1)'"]
      interval: 5s
      timeout: 3s
      retries: 24
  node-chrome-2:
    image: selenium/node-chrome:4.25.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    environment: *browser_env
    healthcheck: *browser_health
  node-firefox:
    image: selenium/node-firefox:4.25.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    environment: *browser_env
    healthcheck: *browser_health
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8080:8080"]
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-nascon}:${POSTGRES_PASSWORD:-nascon}@db:5432/${POSTGRES_DB:-nascon}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-}
      DAY1_SALT: ${DAY1_SALT:?DAY1_SALT must be supplied}
      DAY2_SALT: ${DAY2_SALT:-}
      STRICT_READINESS: "1"
      MEDIA_HEALTH_URL: http://mediamtx:9997/v3/paths/list
      MEDIA_API_URL: http://mediamtx:9997
      MEDIA_METRICS_URL: http://mediamtx:9998/metrics
      MINIO_HEALTH_URL: http://minio:9000/minio/health/ready
      MINIO_ENDPOINT: minio
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nasconminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      mediamtx: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["npm", "run", "worker"]
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-nascon}:${POSTGRES_PASSWORD:-nascon}@db:5432/${POSTGRES_DB:-nascon}
      DAY1_SALT: ${DAY1_SALT:?DAY1_SALT must be supplied}
      DAY2_SALT: ${DAY2_SALT:-}
    depends_on:
      redis: { condition: service_healthy }
      db: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');process.exit(Date.now()-fs.statSync('/tmp/nascon-worker-heartbeat').mtimeMs<15000?0:1)"]
      interval: 5s
      timeout: 2s
      retries: 20
volumes:
  postgres_data:
  minio_data:
  redis_data:
